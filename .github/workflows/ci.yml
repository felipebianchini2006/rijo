name: ci

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-pack:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; macos-15-intel is GitHub's supported
        # x86_64 compatibility image through August 2027.
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Install Chromium for real production-gate tests
        if: startsWith(matrix.os, 'macos')
        run: npm exec -- playwright install chromium

      - run: npm run typecheck

      # unit + integration + golden + CLI E2E with fake agent runner,
      # including tests/pack.e2e.test.ts which packs the tarball, installs it
      # into an empty fixture and executes the packaged CLI.
      #
      # The macOS legs exercise the real browser/sandbox gates in addition to
      # the portable unit, integration and recovery suites.
      - run: npm test

      - run: npm run build

      - run: npm pack

      # Cross-platform tarball validation in a clean fixture directory,
      # independent of tests/pack.e2e.test.ts: proves the packaged tarball
      # installs and runs standalone on every matrix OS. Runs under bash
      # even on windows-runners for a single consistent script.
      - name: Validate packed tarball in clean fixture
        shell: bash
        run: |
          set -euo pipefail

          PKG_DIR="$(pwd)"
          TARBALL="$(ls "$PKG_DIR"/rijo-*.tgz)"
          echo "Using tarball: $TARBALL"

          FIXTURE_DIR="$(mktemp -d)"
          cd "$FIXTURE_DIR"

          npm init -y
          npm install "$TARBALL"

          echo "== npx rijo --version =="
          npx rijo --version

          echo "== npx rijo --status --json =="
          npx rijo --status --json

          echo "== ESM import surface =="
          node -e "import('rijo').then(m => console.log(Object.keys(m)))"

          echo "== packaged SQLite driver + integrity + backup =="
          node --input-type=module -e "import { SqliteStateStore } from 'rijo'; const store = new SqliteStateStore({ projectRoot: process.cwd() }); await store.initialize(); const result = await store.integrityCheck(); if (!result.ok) throw new Error(result.errors.join('; ')); await store.createBackup('.rijo/state/backups/ci.sqlite'); await store.close();"
          test -f .rijo/state/backups/ci.sqlite

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
